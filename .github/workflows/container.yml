name: Test and publish container

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  IMAGE: ghcr.io/kshekar16/greentopographysimulator

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install ".[web,dev]"
      - run: pytest -q

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      # Build for this runner first and smoke-test the real image before publishing.
      - name: Build (amd64, local)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Containerfile
          load: true
          tags: greensim:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: |
          set -eux
          mkdir -p out && chmod 777 out
          docker run --rm -v "$PWD/out:/data" greensim:test render --scan none -o /data/green.png
          docker run --rm -v "$PWD/out:/data" greensim:test scan --scan aerial -o /data/scan.las
          test -s out/green.png && test -s out/scan.las
          docker run -d --name viewer -p 8080:8080 greensim:test
          for i in $(seq 1 60); do curl -sf -o /dev/null http://localhost:8080/index.html && break; sleep 2; done
          curl -sf -o /dev/null http://localhost:8080/index.html
          docker logs viewer
          docker rm -f viewer

      - uses: actions/upload-artifact@v4
        with:
          name: smoke-test-output
          path: out/

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (amd64 + arm64)
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Containerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
